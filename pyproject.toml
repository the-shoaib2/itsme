[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itsme"
version = "0.1.0"
description = "ItsMe — The Voice of Me: Production Personal Voice Cloning and Fine-Tuning System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ItsMe Team" }
]
dependencies = [
  "torch>=2.0.0",
  "torchaudio>=2.0.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "soundfile>=0.12.0",
  "pydub>=0.25.1",
  "librosa>=0.10.0",
  "pyarrow>=14.0.0",
  "pandas>=2.0.0",
  "pyyaml>=6.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.22.0",
  "websockets>=11.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "tqdm>=4.65.0",
  "click>=8.1.0",
  "huggingface-hub>=0.19.0",
  "modelscope>=1.10.0",
  "onnxruntime>=1.15.0",
  "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.0",
  "black>=23.0.0",
]

[project.scripts]
itsme = "itsme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

