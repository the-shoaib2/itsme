model:
  name: "FunAudioLLM/Fun-CosyVoice3-0.5B-2512"

audio:
  sample_rate: 24000

dataset:
  speaker: "itsme"
  train: "data/cosyvoice/train"
  validation: "data/cosyvoice/validation"

training:
  epochs: 30
  batch_size: 4
  learning_rate: 0.0001
  gradient_accumulation_steps: 2
  mixed_precision: true
  save_every: 50
  validation_every: 50
  warmup_steps: 20
  weight_decay: 0.01

hardware:
  device: "auto"
  num_gpus: 1
  seed: 42
